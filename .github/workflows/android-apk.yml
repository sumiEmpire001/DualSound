
name: Build DualSound Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Extract starter project
        run: unzip -q DualSound-Android-Project.zip -d starter

      - name: Generate Gradle wrapper
        run: gradle -p starter/DualSound wrapper --gradle-version 8.11.1

      - name: Build debug APK
        run: starter/DualSound/gradlew -p starter/DualSound assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DualSound-debug-apk
          path: starter/DualSound/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
