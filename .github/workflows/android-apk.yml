
name: Build DualSound Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-cmdline
          mv /tmp/android-cmdline/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Extract starter project
        run: unzip -q DualSound-Android-Project.zip -d starter

      - name: Generate Gradle wrapper
        run: gradle -p starter/DualSound wrapper --gradle-version 8.11.1

      - name: Align Java and Kotlin JVM targets
        run: |
          python3 -c 'from pathlib import Path; p=Path("starter/DualSound/app/build.gradle.kts"); s=p.read_text(); marker="android {"; assert marker in s; insert="\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n"; s=s if "compileOptions {" in s else s.replace(marker, marker+insert, 1); p.write_text(s)'

      - name: Build debug APK
        run: starter/DualSound/gradlew -p starter/DualSound assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: DualSound-debug-apk
          path: starter/DualSound/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
